<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>漫画生产平台</title>
  <link rel="stylesheet" href="/shell/styles.css">
</head>
<body>
  <div id="app" class="app"></div>

  <dialog id="new-project-dialog" class="dialog" aria-labelledby="new-project-title">
    <form id="new-project-form" method="dialog">
      <h2 id="new-project-title">新建项目</h2>
      <label class="field">
        <span>项目名称</span>
        <input name="title" required maxlength="180" autocomplete="off" placeholder="例：开局神戒召唤万虫">
      </label>
      <label class="field">
        <span>墨库项目编号（可稍后关联）</span>
        <input name="mokuProjectId" autocomplete="off" placeholder="墨库 projectId">
      </label>
      <p class="hint">一个本地项目只映射一个墨库项目；关联由人确认一次，之后不做自动匹配。</p>
      <div class="dialog-actions">
        <button type="button" class="button ghost" data-close>取消</button>
        <button type="submit" class="button primary">创建</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/shell/app.mjs"></script>
</body>
</html>
