<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目排版学习工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand">▥ <strong id="brandTitle">整话排版</strong><span id="brandHint">参考学习 → 固定分镜 → 布局 JSON</span></div><a id="backToEditor" class="previewBack" href="/" hidden>返回排版</a><div class="version">项目学习 0.3</div></header>
<div class="app">
<aside class="left"><label>当前项目<select id="project"></select></label><div class="tabs"><button id="refTab" class="active">参考学习</button><button id="draftTab">分镜排版</button></div><div class="section-head"><strong id="listTitle">成熟排版参考</strong><label class="upload">＋ 导入<input id="upload" type="file" hidden></label></div><div id="items"></div><div id="profile" class="profile"></div><p class="muted foot">原始长图和分镜不改写。核对记录、试排与历史版本保存在本工具目录。</p></aside>
<main><div class="toolbar"><div><h1 id="title">载入中…</h1><p id="subtitle"></p></div><div class="actions"><a id="openPreview" class="previewButton" href="/?view=preview&id=dazhou-ep26" target="_blank" hidden>竖向整话预览 ↗</a><button id="modelGenerate" class="primary" hidden>Codex自动排版</button><button id="generate" hidden>规则试排（对照）</button><button id="save">保存核对</button><button id="export" class="primary" hidden>导出 JSON</button></div></div><div id="status" role="status"></div><div class="viewer-head"><span id="viewerHint">点选边框查看；勾选核对后才参与学习</span><div><label>缩放 <input id="zoom" type="number" min="0.5" max="400" step="0.1" value="50"> %</label><button id="fitWidth">适合宽度</button><button id="fitAll">整话总览</button><button id="add">框选漏格</button></div></div><div id="viewport" tabindex="0" aria-label="竖向排版预览，Ctrl加滚轮缩放"><div id="canvasWrap"><img id="referenceImage" alt="成品长图参考"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div></div></main>
<aside class="right"><div class="inspector-title">画格属性<span id="selection">未选中</span></div><div id="emptySelection" class="muted">点击预览中的画格，即可查看和调整。</div><div id="fields" hidden><div class="field-grid"><label>X<input id="x" type="number" min="0" step="1"></label><label>Y<input id="y" type="number" min="0" step="1"></label><label>宽 W<input id="w" type="number" min="1" step="1"></label><label>高 H<input id="h" type="number" min="1" step="1"></label></div><label>画格角色<select id="role"><option value="main">主格</option><option value="support">副格</option></select></label><label id="checkLabel" class="check"><input id="checked" type="checkbox">边界已核对，纳入学习</label><div id="details"></div><button id="remove" class="danger">删除误识别候选</button></div><div class="boundary"><strong>本工具负责</strong><p>画格位置、尺寸、主副格与留白。</p><strong>脚本要求沿用</strong><p>构图、景别、机位、人物关系。格数与阅读顺序固定。</p><strong>交给下游</strong><p>格内人物计划、气泡与对白排版。已接入工程Agent；最多2泡，必要拆格在排版前确定。</p></div></aside>
</div><script src="/preview-zoom.js"></script><script src="/app.js"></script><script src="/library.js"></script><script src="/script-library.js"></script><script src="/studio-bridge.js"></script></body></html>
