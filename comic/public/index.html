<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画工作台10.24 · 分镜制作与自动排版</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/workbench.css"><link rel="stylesheet" href="/strip-space.css"><link rel="stylesheet" href="/panel-reference.css"><link rel="stylesheet" href="/integration.css"><link rel="stylesheet" href="/responsive-workbench.css"><link rel="stylesheet" href="/episode-boards.css"><link rel="stylesheet" href="/panel-inspector.css"><link rel="stylesheet" href="/bubble-inspector.css"><link rel="stylesheet" href="/job-cards.css"><link rel="stylesheet" href="/frame-generation-status.css">
<link rel="stylesheet" href="/canvas-layer-order.css">
<link rel="stylesheet" href="/codex-login.css">
<link rel="stylesheet" href="/integrated-workspace.css"><link rel="stylesheet" href="/canvas-tool-dock.css"><link rel="stylesheet" href="/reference-workspace.css"><link rel="stylesheet" href="/asset-workspace.css"><link rel="stylesheet" href="/project-sync.css"><link rel="icon" href="/icons/book-2.svg" type="image/svg+xml"><link rel="stylesheet" href="/production-package.css"><link rel="stylesheet" href="/local-region.css"><link rel="stylesheet" href="/team-toolbar.css"><link rel="stylesheet" href="/episode-generation-batches.css"><link rel="stylesheet" href="/compact-settings.css">
<link rel="stylesheet" href="/layout-repair.css">
</head>
<body class="modern-workbench">
<header class="topbar">
  <div class="brand"><span class="brand-mark"><img src="/icons/book-2.svg" alt=""></span><span>长条漫画</span></div>
  <div class="project-switcher">
    <button id="project-trigger" class="project-trigger" aria-label="选择漫画工程" aria-expanded="false" aria-controls="project-menu"><span id="project-label">正在载入</span><img class="ui-icon" src="/icons/chevron-down.svg" alt=""></button>
    <select id="project-select" aria-label="选择漫画工程" hidden></select>
    <div id="project-menu" class="ui-popover project-menu" hidden><div id="project-choices" class="project-choices"></div><div class="menu-divider"></div><button id="close-project" disabled><img class="ui-icon" src="/icons/x.svg" alt="">关闭当前项目</button><button id="new-project"><img class="ui-icon" src="/icons/plus.svg" alt="">新建漫画项目</button><button id="manage-projects"><img class="ui-icon" src="/icons/list-details.svg" alt="">项目管理 / 已删除项目</button><button id="open-moku-project">从墨库打开工程</button><button id="save-project"><img class="ui-icon" src="/icons/device-floppy.svg" alt="">保存工程文件 · Ctrl+S</button></div>
  </div>
  <button id="storyboard-import" class="primary">导入工程文件</button><a id="asset-studio-open" href="/api/project-center/asset-studio/open" target="_blank" rel="noopener" title="打开资产工作室">资产工作室</a><div class="integration-actions"></div><div class="top-spacer"></div>
  <span class="save-indicator"><img class="ui-icon" src="/icons/check.svg" alt=""><span id="save-state" role="status">正在载入</span></span>
  <button id="codex-connect" class="connection"><span class="dot"></span><span id="codex-label">检查连接</span></button>
  <button id="layout-history-paused" hidden style="color:#b53a2b" role="status">调整记录已暂停 · 查看</button><div class="export-wrap"><button id="export-toggle" class="primary">导出<img class="ui-icon" src="/icons/chevron-down.svg" alt=""></button><div id="export-menu" class="dropdown" hidden><button id="export-page">当前长图 PNG</button><button id="export-episode">整话连续 PNG</button><button id="export-project">跨机工程文件</button><button id="export-layout">版式草稿 PNG</button><button id="layout-adjustments">画板调整记录 · 查看 / 导出</button></div></div>
</header>
<div class="canvas-toolbar">
      <div class="workspace-controls"><button id="view-more" class="icon-button" aria-label="视图选项" aria-expanded="false" aria-controls="view-menu"><img class="ui-icon" src="/icons/dots.svg" alt=""></button><button id="panel-notes-toggle" aria-pressed="true" aria-label="隐藏全部格内提示词" title="批量隐藏所有画板格子中的提示词和原剧情"><img class="ui-icon" src="/icons/eye-off.svg" alt=""><span>隐藏全部提示词</span></button><div id="view-menu" class="ui-popover view-menu" hidden><button id="draft-toggle" aria-pressed="false">版式草稿</button><button id="inspector-toggle" aria-controls="inspector-panel" aria-expanded="false">打开属性面板</button></div></div>
      <div class="tools" role="group" aria-label="画布工具"><button data-tool="move"><img class="ui-icon" src="/icons/pointer.svg" alt="">选择</button><div class="select-all-wrap"><button id="select-all-trigger" aria-label="全选范围" aria-expanded="false" aria-controls="select-all-menu">全选<img class="ui-icon" src="/icons/chevron-down.svg" alt=""></button><div id="select-all-menu" class="ui-popover" hidden><button data-select-scope="page">当前页面 <kbd>Ctrl+A</kbd></button><button data-select-scope="all">本话全部画板 <kbd>Ctrl+Shift+A</kbd></button></div></div><div class="panel-tool-wrap"><button id="panel-tool-toggle" aria-label="编辑格子" aria-expanded="false" aria-controls="panel-tool-menu"><img class="ui-icon" src="/icons/border-all.svg" alt="">格子</button><div id="panel-tool-menu" class="ui-popover" hidden><button data-tool="nodes">编辑轮廓 / 自由节点</button><button data-tool="rect">调整矩形</button><button id="toolbar-add-panel">新增格子</button><button data-tool="mask">蒙版画笔</button></div></div><button data-tool="image"><img class="ui-icon" src="/icons/crop.svg" alt="">图片</button><button id="image-layer-copy" data-image-layer-action="copy" title="复制选中的画面层（Ctrl+C），不复制对白" disabled>复制画面</button><button id="image-layer-paste" data-image-layer-action="paste" title="粘贴独立画面层（Ctrl+V）；Ctrl+D 直接复制一层" disabled>粘贴画面</button><button id="add-bubble"><img class="ui-icon" src="/icons/message-circle.svg" alt="">对白</button><button data-open-sfx aria-expanded="false" aria-controls="sfx-library" title="拟声拟声字素材：点选添加独立文字层">特效字库</button><button id="gradient-tool" title="新建或编辑独立渐变图层"><img class="ui-icon" src="/icons/color-swatch.svg" alt="">渐变</button><button data-tool="insert-space" title="在格子间画线，自动取色并插入一截底图"><img class="ui-icon" src="/icons/insert-space.svg" alt="">插入底图</button><button id="page-settings" class="page-settings-button" title="调整当前页长度与底色"><img class="ui-icon" src="/icons/settings.svg" alt="">长条设置</button></div>
      <div class="toolbar-right"><button id="history-steps-toggle" data-open-history-steps aria-expanded="false" aria-controls="layout-history-steps" title="展开修改步骤，点击定位；撤回 / 重做有独立按钮">修改步骤</button><button id="panel-info-toggle" aria-pressed="false" title="按需显示分镜说明；选中画格后也可在右侧编辑镜头">显示分镜说明</button><button id="undo" disabled aria-label="撤销修改"><img class="ui-icon" src="/icons/arrow-back-up.svg" alt=""></button><button id="redo" disabled aria-label="重做修改"><img class="ui-icon" src="/icons/arrow-forward-up.svg" alt=""></button><div class="toolbar-separator"></div><select id="zoom" aria-label="画布缩放" title="Ctrl + 滚轮：缩放画板；普通滚轮：上下滚动"><option value="fit">适合宽度</option><option value="page">整页预览</option><option value="0.25">25%</option><option value="0.4">40%</option><option value="0.65" selected>65%</option><option value="1">100%</option></select></div>
    <div class="generation-actionbar" role="group" aria-label="画格与本话生图"><button id="generate-current-panel" class="primary" disabled>生成本格图片</button><button id="generate-current-episode" class="primary" disabled>一键生成本话图片</button><button id="prompt-source-batch" type="button" disabled>批量选提示词</button><span id="generation-scope-status">请先导入或新建漫画工程</span></div>
    </div>
<div class="app-shell sidebar-collapsed inspector-collapsed">
  <nav class="workspace-rail" aria-label="工作区导航">
    <button class="rail-button active" data-rail-tab="pages"><img class="ui-icon" src="/icons/file.svg" alt=""><span>画布</span></button>
    <button class="rail-button" data-rail-tab="layers"><img class="ui-icon" src="/icons/stack-2.svg" alt=""><span>图层</span></button>
    <button class="rail-button" data-rail-tab="production"><img class="ui-icon" src="/icons/file-import.svg" alt=""><span>制作资料</span></button>
    <button class="rail-button" data-rail-tab="references"><img class="ui-icon" src="/icons/photo.svg" alt=""><span>本话资产</span></button>
    <button class="rail-button" data-open-generation-settings><img class="ui-icon" src="/icons/settings.svg" alt=""><span>设置</span></button>
  </nav>
  <aside id="sidebar-panel" class="sidebar"><div class="panel-close-heading"><span id="sidebar-heading">页面与素材</span><button id="sidebar-close" aria-label="收起页面与素材"><img class="ui-icon" src="/icons/x.svg" alt=""></button></div>
    <div id="episode-workspace" class="episode-workspace" hidden><label>当前话<select id="episode-select" aria-label="选择当前话"></select></label><span id="episode-status"></span></div>
    <button data-tab="tools" hidden>工具</button>
    <div class="side-tabs"><button class="active" data-tab="pages">画板</button><button data-tab="layers">图层</button><button data-tab="production">制作资料</button></div>
    <p id="sidebar-empty-note" class="sub-note" hidden>请先新建或导入漫画工程。</p>
    <section id="pages-tab" class="side-content"><div class="section-heading"><span>本话画板</span><button id="add-page" aria-label="新增长图"><img class="ui-icon" src="/icons/plus.svg" alt=""></button></div><div id="page-list"></div></section>
    <section id="layers-tab" class="side-content" hidden><div class="section-heading"><span id="layer-count">图层</span><button id="layers-toggle" class="icon-button" title="图层管理"><img class="ui-icon" src="/icons/stack-2.svg" alt=""></button></div><label class="checkbox-field locate-setting"><input id="auto-locate-layer" type="checkbox" checked>点击图层自动定位</label><div class="layer-filters"><input id="layer-search" type="search" placeholder="搜索图层" aria-label="搜索图层"><select id="layer-scope" aria-label="图层范围"><option value="all">本话全部画板</option><option value="page">当前画板</option></select></div><div class="layer-create"><button id="layer-add" title="新增格子">格子 +</button><button id="layer-add-bubble" title="新增对白">对白 +</button><button data-open-sfx aria-expanded="false" aria-controls="sfx-library">特效 +</button><button id="layer-add-gradient" title="新增独立渐变">渐变 +</button></div><div class="layer-actions"><button id="layer-stack-up">上移</button><button id="layer-stack-down">下移</button><button id="layer-delete">删除</button></div><p class="sub-note">上方图层覆盖下方图层 · 拖动调整顺序 · 双击名称重命名</p><div id="layer-list"></div></section>

    <section id="shots-tab" class="side-content" hidden><div class="section-heading"><span>镜头表</span><button id="add-shot" aria-label="新增镜头"><img class="ui-icon" src="/icons/plus.svg" alt=""></button></div><button id="import-shots" class="wide">导入 / 粘贴分镜表</button><div id="shot-list"></div></section>
    <section id="production-tab" class="side-content" hidden></section>
    <section id="references-tab" class="side-content" hidden><div class="section-heading"><span>统一参考图</span></div><button id="asset-directory" class="wide">墨库素材</button><button id="add-reference" class="wide">从墨库添加参考</button><div id="reference-list"></div></section>
    
    <div class="sidebar-foot"><span>本机工程 · 自动保存</span></div>
  </aside>
  <main class="editor">
    <div class="canvas-heading legacy-status" hidden><span id="page-heading"></span><div class="page-dimensions"><span id="page-width-label"></span><input id="page-height-input" type="number" min="1" value="3840" aria-label="当前页高度（像素）"></div></div>
    <div class="canvas-wrap"><div id="canvas-scroll" class="canvas-scroll"><svg id="stage" role="img" aria-label="可编辑的长条漫画画布"></svg><div id="empty-project" class="empty-project" hidden><strong>导入制作资料</strong><span></span><button id="storyboard-import-empty" class="primary">导入工程文件</button></div></div><div id="panel-info-layer" class="panel-info-layer"></div><div id="image-context" class="image-context" data-image-controls hidden><span>调整取景</span><button data-action="fit-image">填满</button><button data-action="zoom-image-in">放大图片</button><button data-action="zoom-image-out">缩小图片</button></div></div>
  </main>
  <aside id="inspector-panel" class="inspector mobile-hidden"><div class="inspector-title"><div class="inspector-heading"><strong id="inspector-kind">格子属性</strong><small id="inspector-title"></small></div><button id="delete-layer" class="icon-button" aria-label="删除选中图层" title="删除选中图层"><img class="ui-icon" src="/icons/trash.svg" alt=""></button><button id="inspector-close" class="icon-button" aria-label="关闭属性"><img class="ui-icon" src="/icons/x.svg" alt=""></button></div><div id="inspector-body"></div></aside>
</div>
<section class="job-tray collapsed"><div class="job-heading"><span class="task-caption"><img class="ui-icon" src="/icons/list-details.svg" alt="">任务</span><span id="job-count" role="status">暂无进行中的任务</span><button id="jobs-toggle" class="text-button" aria-controls="job-list" aria-expanded="false"><span data-job-label>查看任务</span><img class="ui-icon" src="/icons/chevron-right.svg" alt=""></button><span id="job-latest-status" class="job-latest-status" role="status"></span><button id="cancel-recent-jobs" disabled title="只取消最近一次提交中尚未结束的任务">取消最近一次</button><button id="cancel-all-jobs" title="取消当前漫画全部排队、运行、待确认和待恢复任务" disabled>取消全部任务</button><div id="episode-batch-status" class="episode-batch-status" role="status" hidden></div><span id="runtime-memory" class="runtime-memory" aria-label="内存占用">内存：读取中</span><div class="footer-spacer"></div><span class="zoom-help"><img class="ui-icon" src="/icons/info-circle.svg" alt="">Ctrl + 滚轮缩放</span><button id="page-marker" class="page-marker" title="调整长条长度">P001 / 1</button><span id="tool-hint" class="sr-only"></span><span id="selection-status" class="sr-only"></span></div><div id="job-list"></div></section>
<dialog id="generation-settings-dialog" class="settings-dialog"><div class="modal-heading"><h2>生图设置</h2><button id="generation-settings-close" class="icon-button" aria-label="关闭生图设置"><img class="ui-icon" src="/icons/x.svg" alt=""></button></div><section id="platform-concurrency-settings"></section><label>生成渠道<select id="generation-provider" aria-label="选择生图来源"><option value="jimeng">即梦</option><option value="codex">Codex</option></select></label><div id="jimeng-options" class="generation-options"><label>官方模型<select id="generation-model" aria-label="即梦官方模型"><option value="">登录后读取模型</option></select></label><label>方式<select id="generation-mode" aria-label="即梦生图方式"><option value="t2i">文生图</option><option value="i2i">图生图</option></select></label><div id="generation-ratio-field"></div><div id="generation-resolution-field"></div><button id="refresh-generation-options" class="text-button">刷新官方模型</button><span id="generation-status" role="status">等待检查连接</span></div><p class="sub-note">设置会用于接下来的镜头；生成费用按每次实际报价确认。</p><button id="generation-settings-done" class="primary wide">完成</button></dialog>
<input id="project-input" type="file" accept=".json" hidden>
<dialog id="storyboard-import-dialog" class="storyboard-import-dialog"><div class="modal-heading"><h2>导入制作资料</h2><button data-storyboard-import-close aria-label="关闭分镜导入">×</button></div><div class="storyboard-import-body"></div><div class="storyboard-import-actions"></div></dialog>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" aria-label="关闭"><img class="ui-icon" src="/icons/x.svg" alt=""></button></div><div id="modal-body"></div><div id="modal-actions"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div><script type="module" src="/app.js"></script>
<script type="module" src="/runtime-memory.js"></script>
<script type="module" src="/team-update-ui.js"></script></body></html>
