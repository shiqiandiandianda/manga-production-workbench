<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>资产工作室</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #f2efe6;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .fallback {
      display: grid;
      place-items: center;
      height: 100%;
      color: #3b4d54;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <iframe src="http://127.0.0.1:8796/?embed=1" title="资产工作室" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'资产工作室未启动：请先运行 启动资产工作台.cmd'}))"></iframe>
</body>
</html>
