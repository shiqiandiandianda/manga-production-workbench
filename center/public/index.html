<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫画共享资产中心</title><link rel="stylesheet" href="/center.css"></head><body>
<header><div class="brand"><img src="/icons/stack-2.svg" alt=""><strong>共享资产中心</strong></div><nav aria-label="资产中心导航"><button data-tab="tasks" class="active">需求队列</button><button data-tab="assets">资产库</button><button data-tab="connections">接入管理</button></nav><span class="spacer"></span><span id="identity"></span><button id="refresh" title="刷新" aria-label="刷新"><img src="/icons/arrow-forward-up.svg" alt=""></button><button id="logout" hidden>退出</button></header>
<main><section id="login"><h1>连接资产中心</h1><form id="login-form"><label>访问令牌<input id="access-token" type="password" autocomplete="off" required></label><button class="primary" type="submit">连接</button></form><p id="login-error" role="alert"></p></section>
<section id="workspace" hidden><div class="metrics" id="metrics"></div><div class="filters"><label>作品<select id="work-filter"><option value="">全部作品</option></select></label><label id="status-filter-label">任务状态<select id="status-filter"><option value="">全部状态</option><option value="pending">等待领取</option><option value="running">生成中</option><option value="review">待确认</option><option value="needs_info">待补资料</option><option value="uncertain">状态待确认</option><option value="done">已完成</option><option value="failed">失败</option></select></label><span class="spacer"></span><input id="import-json" type="file" accept=".json,application/json" hidden><button id="import-button"><img src="/icons/file-import.svg" alt="">导入需求JSON</button><button id="backup-button"><img src="/icons/device-floppy.svg" alt="">备份资料</button></div>
<section id="tasks-view"><div class="table-scroll"><table><thead><tr><th>资产</th><th>服装 / 状态</th><th>使用话数</th><th>渠道</th><th>状态</th><th>进度 / 最近消息</th><th>操作</th></tr></thead><tbody id="tasks-body"></tbody></table></div></section>
<section id="assets-view" hidden><div class="table-scroll"><table><thead><tr><th>预览</th><th>资产</th><th>服装 / 状态</th><th>正式版本</th><th>使用话数</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="assets-body"></tbody></table></div></section>
<section id="connections-view" hidden><h2>接入令牌</h2><form id="key-form"><label>名称<input id="key-label" maxlength="100" required></label><label>权限<select id="key-role"><option value="client">工作台</option><option value="worker">生图接单器</option><option value="admin">管理员</option></select></label><label>作品范围<select id="key-work"><option value="">全部作品</option></select></label><button class="primary">创建令牌</button></form><div id="new-key" hidden><strong>新令牌</strong><textarea id="new-key-value" readonly rows="2"></textarea><button id="copy-key">复制令牌</button></div><div class="table-scroll"><table><thead><tr><th>名称</th><th>权限</th><th>作品范围</th><th>状态</th><th>操作</th></tr></thead><tbody id="keys-body"></tbody></table></div><h2>工具接入</h2><div class="integration-links"><a href="/openapi.json" target="_blank" rel="noopener">API 协议</a><span id="center-address"></span></div></section>
<footer><span id="page-status"></span><span class="spacer"></span><button id="prev" title="上一页" aria-label="上一页">&lt;</button><button id="next" title="下一页" aria-label="下一页">&gt;</button></footer></section></main>
<dialog id="details"><div class="dialog-heading"><h2 id="details-title"></h2><button id="details-close" aria-label="关闭"><img src="/icons/x.svg" alt=""></button></div><div id="details-body"></div><div id="details-actions"></div></dialog><input id="result-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><div id="notice" role="status" hidden></div><script type="module" src="/center.js"></script></body></html>
